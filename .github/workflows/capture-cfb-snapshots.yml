name: Capture CFB pregame snapshots
on:
  workflow_dispatch:
  schedule:
    # Conserve Odds API credits early in the week; keep frequent pregame capture Friday/Saturday.
    # GitHub Actions cron is UTC. Manual workflow_dispatch remains available.
    - cron: '17 1,9,17 * * 0-4'
    - cron: '17 1,5,9,13,17,21 * * 5,6'
permissions:
  contents: write
concurrency:
  group: cfb-snapshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy pandas
      - name: Test prospective selection rules and same-capture evidence
        run: |
          python -m unittest discover -v
          python -m unittest discover -s tests -v
      - name: Capture live odds and freeze prospective selections
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python - <<'PYCODE'
          from snapshot_capture import capture
          from prospective_capture import capture_prospective
          import csv
          from pathlib import Path
          rows, _ = capture()
          if not rows:
              print('CAPTURE STATUS: no eligible snapshot rows; no new V3 agreement evidence expected')
          else:
              picks = capture_prospective(rows, int(rows[0]['season']))
              new_v3 = [p for p in picks if p['model_version'] == 'v3']
              evidence_path = Path('prospective/v3_pregame_agreement.csv')
              if new_v3:
                  if not evidence_path.exists():
                      raise RuntimeError('New V3 selections lack same-capture agreement evidence')
                  with evidence_path.open(newline='', encoding='utf-8') as handle:
                      evidence = list(csv.DictReader(handle))
                  for pick in new_v3:
                      matching = [e for e in evidence if
                                  str(e['season']) == str(pick['season']) and
                                  str(e['game_id']) == str(pick['game_id']) and
                                  e['captured_at_utc'] == pick['captured_at_utc']]
                      if len(matching) != 1:
                          raise RuntimeError('Missing or duplicate agreement evidence for newly frozen V3 game')
              print(f'CAPTURE STATUS: snapshot_rows={len(rows)}, new_v3={len(new_v3)}, '
                    f'agreement_file_present={evidence_path.exists()}')
          PYCODE
      - name: Refresh read-only V3 research report
        run: python v3_shadow_monitor.py
      - name: Commit snapshots, selections and research report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshots/ prospective/ reports/v3_shadow_monitor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive pregame snapshot and freeze prospective picks'
            git pull --rebase origin main
            git push
          fi
