name: Capture CFB pregame snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: cfb-snapshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy
      - name: Test prospective selection rules
        run: python -m unittest -v test_prospective_capture.py
      - name: Capture live odds and freeze prospective selections
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python - <<'PYCODE'
          from snapshot_capture import capture
          from prospective_capture import capture_prospective
          rows, _ = capture()
          if rows:
              capture_prospective(rows, int(rows[0]['season']))
          PYCODE
      - name: Commit snapshots and prospective selections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshots/ prospective/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive pregame snapshot and freeze prospective picks'
            git push
          fi
