name: Lock V3 weekday and Saturday predictions
on:
  workflow_dispatch:
  schedule:
    # 8 AM Central is 13:00 UTC in daylight time, 14:00 UTC in standard time.
    # The Python timezone guard rejects the nonmatching hour and weekday.
    - cron: '0 13,14 * * 2,6'
permissions:
  contents: write
concurrency:
  group: v3-all-games-lock
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy pandas scipy
      - name: Run lock unit tests
        run: python -m unittest -v test_v3_weekly_lock.py
      - name: Manual test summary
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Manual test completed; scheduled lock intentionally skipped outside Tuesday/Saturday 8 AM Central.' >> "$GITHUB_STEP_SUMMARY"
      - name: Lock every scheduled game with PLAY or PASS
        if: github.event_name == 'schedule'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python v3_weekly_lock.py
      - name: Commit immutable dated lock and hash
        if: github.event_name == 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locks/ snapshots/
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze scheduled V3 PLAY/PASS game predictions'
            git pull --rebase origin main
            git push
          fi
