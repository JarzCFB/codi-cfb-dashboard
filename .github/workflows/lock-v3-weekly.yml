name: Lock V3 weekday and Saturday predictions
on:
  pull_request:
    paths:
      - "v3_weekly_lock.py"
      - "test_v3_weekly_lock.py"
      - ".github/workflows/lock-v3-weekly.yml"
  workflow_dispatch:
  schedule:
    # 8 AM Central is 13:00 UTC in daylight time, 14:00 UTC in standard time.
    # The Python timezone guard rejects the nonmatching hour and weekday.
    - cron: '0 13,14 * * 2,6'
permissions:
  contents: write
concurrency:
  group: v3-all-games-lock
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy pandas scipy
      - run: python -m unittest -v test_v3_weekly_lock.py test_v3_upcoming_watchlist.py
  lock:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy pandas scipy
      - name: Run lock unit tests
        run: python -m unittest -v test_v3_weekly_lock.py test_v3_upcoming_watchlist.py
      - name: Lock upcoming games with as-of PLAY or PASS (late locks labeled separately)
        env:
          V3_MANUAL_LATE_LOCK: ${{ github.event_name != 'schedule' && '1' || '0' }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python v3_weekly_lock.py
      - name: Update current-week line movement watchlist
        run: python v3_upcoming_watchlist.py
      - name: Commit immutable dated lock and hash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locks/ snapshots/ reports/v3_upcoming_line_watchlist.json reports/v3_upcoming_line_watchlist.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze scheduled V3 PLAY/PASS game predictions'
            git pull --rebase origin main
            git push
          fi
