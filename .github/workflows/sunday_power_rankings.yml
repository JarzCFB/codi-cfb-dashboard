name: Publish Sunday power rankings
on:
  schedule:
    # 1 PM America/Chicago is 18:00 UTC in CDT, 19:00 UTC in CST.
    - cron: "0 18,19 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sunday-power-rankings
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish Sunday snapshot if local time matches
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python publish_weekly_rankings.py
      - name: Commit published rankings
        run: |
          if git status --porcelain rankings_history | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rankings_history
            git commit -m "Publish Sunday power rankings"
            git push
          else
            echo "No new snapshot."
          fi
